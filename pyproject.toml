[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "guitar-notation-generator"
version = "0.1.0"
description = "Local-first guitar notation generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=8"]
[project.scripts]
guitar-notation = "guitar_notation.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
